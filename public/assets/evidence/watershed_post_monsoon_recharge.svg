<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSkyPost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="lushGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="reservoirWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <!-- Clear Post-Monsoon Sky -->
  <rect width="1200" height="675" fill="url(#blueSkyPost)" />

  <!-- Sun -->
  <circle cx="950" cy="110" r="45" fill="#fef08a" opacity="0.9" />

  <!-- Green Vegetated Hills -->
  <path d="M0 290 Q 300 230, 600 270 T 1200 240 L 1200 450 L 0 450 Z" fill="#4d7c0f" opacity="0.8" />
  <path d="M0 320 Q 350 260, 700 310 T 1200 280 L 1200 480 L 0 480 Z" fill="#365314" opacity="0.9" />

  <!-- Rejuvenated Terraced Agricultural Watershed -->
  <polygon points="0,400 1200,400 1200,675 0,675" fill="url(#lushGreen)" />

  <!-- Full Water Harvesting Reservoir Body -->
  <path d="M 320 420 Q 600 395, 880 420 L 960 675 L 240 675 Z" fill="url(#reservoirWater)" />

  <!-- Water Surface Reflections & Concentric Wavelets -->
  <ellipse cx="600" cy="460" rx="240" ry="14" fill="#38bdf8" opacity="0.6" />
  <ellipse cx="580" cy="520" rx="280" ry="16" fill="#7dd3fc" opacity="0.5" />
  <ellipse cx="600" cy="600" rx="320" ry="20" fill="#bae6fd" opacity="0.4" />

  <!-- Constructed Masonry Check Dam Wall (CD-012) -->
  <rect x="360" y="415" width="480" height="24" rx="4" fill="#64748b" stroke="#334155" stroke-width="2" />
  <rect x="460" y="418" width="280" height="14" rx="2" fill="#94a3b8" />
  <!-- Central notch overflow -->
  <path d="M 540 422 Q 600 425, 660 422 L 670 460 Q 600 470, 530 460 Z" fill="#e0f2fe" opacity="0.85" />

  <!-- Thriving Riparian Trees & Crops along Reservoir Margins -->
  <g fill="#16a34a">
    <circle cx="280" cy="440" r="30" />
    <circle cx="250" cy="470" r="36" />
    <circle cx="220" cy="520" r="42" />
    <circle cx="180" cy="580" r="48" />

    <circle cx="920" cy="440" r="30" />
    <circle cx="950" cy="470" r="36" />
    <circle cx="980" cy="520" r="42" />
    <circle cx="1020" cy="580" r="48" />
  </g>

  <!-- Top Banner -->
  <rect x="24" y="24" width="480" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
  <circle cx="44" cy="43" r="6" fill="#10b981" />
  <text x="60" y="47" fill="#34d399" font-size="13" font-family="monospace" font-weight="900" letter-spacing="1">POST-CONSTRUCTION MONITORED &bull; OCT 2024</text>

  <!-- Telemetry HUD -->
  <rect x="24" y="587" width="380" height="64" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
  <text x="40" y="610" fill="#10b981" font-size="11" font-family="monospace" font-weight="bold">TARGET: CD-012 ACTIVE STORAGE</text>
  <text x="40" y="626" fill="#94a3b8" font-size="10" font-family="monospace">POST-MONSOON NDVI: 0.54 (+350% GAIN)</text>
  <text x="40" y="642" fill="#38bdf8" font-size="10" font-family="monospace">WATER STORAGE: 14,200 M&sup3; &bull; INTACT</text>
</svg>
