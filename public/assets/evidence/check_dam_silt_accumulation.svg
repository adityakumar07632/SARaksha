<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="drySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="siltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="80%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <pattern id="crackedMud" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 L 20 20 L 25 0 M 20 20 L 35 35 L 50 25 M 35 35 L 25 50" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.6" />
    </pattern>
    <pattern id="siltedMasonry" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#64748b" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="10" x2="40" y2="10" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="0" x2="20" y2="10" stroke="#334155" stroke-width="1.5" />
      <line x1="10" y1="10" x2="10" y2="20" stroke="#334155" stroke-width="1.5" />
      <line x1="30" y1="10" x2="30" y2="20" stroke="#334155" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Sky (Dry pre-summer / intense sun) -->
  <rect width="1200" height="675" fill="url(#drySky)" />

  <!-- Intense Sun -->
  <circle cx="850" cy="110" r="50" fill="#fbbf24" opacity="0.9" />
  <circle cx="850" cy="110" r="80" fill="#fde047" opacity="0.3" />

  <!-- Arid Aravalli Foothills -->
  <path d="M0 290 Q 300 230, 600 280 T 1200 250 L 1200 420 L 0 420 Z" fill="#a8a29e" opacity="0.7" />
  <path d="M0 320 Q 350 270, 750 310 T 1200 280 L 1200 450 L 0 450 Z" fill="#78716c" opacity="0.8" />

  <!-- Sparse Scrub vegetation on hills -->
  <g fill="#854d0e" opacity="0.7">
    <circle cx="150" cy="310" r="12" />
    <circle cx="340" cy="290" r="16" />
    <circle cx="680" cy="295" r="14" />
    <circle cx="950" cy="285" r="18" />
  </g>

  <!-- Severely Silted Upstream Basin (Heavy Sediment Deposition) -->
  <polygon points="0,380 1200,380 1200,675 0,675" fill="url(#siltGrad)" />
  <polygon points="0,380 1200,380 1200,675 0,675" fill="url(#crackedMud)" />

  <!-- Silt contour buildup layers -->
  <path d="M 100 420 Q 600 450, 1100 420" stroke="#92400e" stroke-width="3" fill="none" opacity="0.5" />
  <path d="M 50 480 Q 600 520, 1150 480" stroke="#78350f" stroke-width="4" fill="none" opacity="0.6" />
  <path d="M 0 560 Q 600 600, 1200 560" stroke="#713f12" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Submerged / Silted Masonry Check Dam Wall (CD-015) -->
  <!-- Wing Walls partially choked by sediment -->
  <polygon points="180,340 320,340 300,520 160,520" fill="url(#siltedMasonry)" />
  <polygon points="880,340 1020,340 1040,520 900,520" fill="url(#siltedMasonry)" />

  <!-- Central Spillway Crest - Silt is almost level with crest notch! -->
  <polygon points="320,380 880,380 900,520 300,520" fill="url(#siltedMasonry)" />
  <polygon points="320,380 880,380 900,520 300,520" fill="#78350f" opacity="0.4" />

  <!-- Concrete Coping showing cracks and wear -->
  <rect x="310" y="372" width="580" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2" />
  <!-- Spall damage / crack lines -->
  <path d="M 580 372 L 590 384 M 586 378 L 595 381" stroke="#dc2626" stroke-width="2" />

  <!-- Silt layer burying the upstream face (only 0.2m freeboard left!) -->
  <path d="M 280 395 Q 600 410, 920 395 L 940 450 Q 600 470, 260 450 Z" fill="#92400e" opacity="0.95" />
  <path d="M 280 395 Q 600 410, 920 395" stroke="#78350f" stroke-width="3" fill="none" />

  <!-- Silt sediment fan spilling into central overflow notch -->
  <polygon points="460,378 740,378 780,430 420,430" fill="#b45309" stroke="#78350f" stroke-width="1.5" />

  <!-- Small residual stagnant mud puddle (no live storage) -->
  <ellipse cx="600" cy="460" rx="140" ry="16" fill="#713f12" stroke="#451a03" stroke-width="2" />
  <ellipse cx="590" cy="462" rx="90" ry="8" fill="#a16207" opacity="0.6" />

  <!-- Warning Arrow & Deflection Marker -->
  <g transform="translate(600, 320)">
    <rect x="-140" y="-20" width="280" height="34" rx="6" fill="#7f1d1d" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="2" fill="#fecaca" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">⚠️ SILT LEVEL AT SPILLWAY CREST (-42% VOL)</text>
  </g>

  <!-- ISRO / GIS Field Camera Inspection HUD Overlay -->
  <!-- Top Banner: Provenance Classification -->
  <rect x="24" y="24" width="460" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="44" cy="43" r="6" fill="#f59e0b" />
  <text x="60" y="47" fill="#fbbf24" font-size="13" font-family="monospace" font-weight="900" letter-spacing="1">DEMO FIELD EVIDENCE &bull; SIMULATED</text>

  <!-- Top Right Camera Metadata -->
  <rect x="880" y="24" width="296" height="64" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1" />
  <text x="896" y="46" fill="#f87171" font-size="11" font-family="monospace" font-weight="bold">STRUCTURE: CD-015 (SILTED)</text>
  <text x="896" y="62" fill="#fbbf24" font-size="10" font-family="monospace">STATUS: FLAGGED &bull; REVIEW REQUIRED</text>
  <text x="896" y="78" fill="#94a3b8" font-size="10" font-family="monospace">INSPECTION DATE: 2026-08-18 09:20 IST</text>

  <!-- Bottom Left GNSS Lock & Location Telemetry -->
  <rect x="24" y="587" width="380" height="64" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
  <text x="40" y="610" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">GNSS: 27.5810° N, 76.6290° E (&plusmn;3.4m)</text>
  <text x="40" y="626" fill="#94a3b8" font-size="10" font-family="monospace">WATERSHED: WS-001 (Sector 4 Nala)</text>
  <text x="40" y="642" fill="#ef4444" font-size="10" font-family="monospace">DEFECT: EXCESS SEDIMENT ACCUMULATION</text>

  <!-- Bottom Right Action Notice -->
  <rect x="840" y="615" width="336" height="36" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1" />
  <text x="854" y="637" fill="#f87171" font-size="10" font-family="monospace" font-weight="bold">RECOMMENDATION: URGENT DESILTING NOTICE</text>
</svg>
